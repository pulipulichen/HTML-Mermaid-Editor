<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mermaid 渲染與下載工具</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Panzoom (用於支援拖曳與雙指縮放) -->
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <style>
        /* 自訂滾動條樣式 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        #mermaid-output svg {
            max-width: 100%;
            height: auto;
            /* 避免 SVG 本身攔截拖曳事件 */
            pointer-events: none; 
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 p-4 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- 標題區塊 -->
        <header class="text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Mermaid 編輯器 & 下載器</h1>
                <p class="text-sm text-gray-500 mt-1">貼上您的 Mermaid 語法，快速預覽並匯出透明背景的圖片。支援滑鼠滾輪/觸控縮放與拖曳。</p>
            </div>
        </header>

        <!-- 主要佈局 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- 左側：輸入區 -->
            <div class="flex flex-col h-[600px] bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                    <span class="font-medium text-gray-700">Mermaid 語法輸入區</span>
                    <button id="btn-render" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-md text-sm font-medium transition-colors shadow-sm">
                        渲染圖表
                    </button>
                </div>
                <textarea id="mermaid-input" class="flex-1 w-full p-4 resize-none focus:outline-none font-mono text-sm text-gray-700 bg-gray-50" placeholder="在此貼上 Mermaid 語法...">graph TD
    A[使用者] -->|輸入語法| B(編輯器)
    B --> C{渲染成功?}
    C -->|是| D[顯示預覽圖表]
    D --> E[下載 SVG]
    D --> F[下載透明 PNG]
    C -->|否| G[顯示錯誤訊息]
                </textarea>
                <!-- 錯誤訊息顯示區 -->
                <div id="error-msg" class="hidden bg-red-50 text-red-600 p-3 text-sm border-t border-red-200 font-mono break-all overflow-y-auto max-h-32">
                </div>
            </div>

            <!-- 右側：預覽與下載區 -->
            <div class="flex flex-col h-[600px] bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 flex flex-wrap justify-between items-center gap-2">
                    <span class="font-medium text-gray-700">圖表預覽 (支援拖曳與縮放)</span>
                    <div class="flex gap-2">
                        <button id="btn-svg" class="flex items-center gap-1 bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 px-3 py-1.5 rounded-md text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            下載 SVG
                        </button>
                        <button id="btn-png" class="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-md text-sm font-medium transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            下載 PNG
                        </button>
                    </div>
                </div>
                
                <!-- 預覽容器 (Panzoom 事件將綁定於此，確保滑鼠在任何空白處都能拖曳) -->
                <div id="preview-container" class="flex-1 overflow-hidden relative cursor-grab active:cursor-grabbing" style="background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;">
                    
                    <!-- SVG 渲染容器 (實際被變形縮放的元素) -->
                    <div id="mermaid-output" class="w-full h-full flex justify-center items-center origin-center">
                        <!-- Mermaid SVG 將被渲染到這裡 -->
                    </div>

                    <!-- 縮放控制工具列 (右下角懸浮) -->
                    <div class="absolute bottom-4 right-4 z-10 flex gap-1 bg-white/90 p-1.5 rounded-lg shadow-md border border-gray-200 backdrop-blur-sm">
                        <button id="btn-zoom-in" class="p-1.5 hover:bg-gray-100 rounded-md text-gray-700 transition-colors" title="放大">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <button id="btn-zoom-out" class="p-1.5 hover:bg-gray-100 rounded-md text-gray-700 transition-colors" title="縮小">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                        <div class="w-px bg-gray-300 my-1 mx-1"></div>
                        <button id="btn-zoom-reset" class="p-1.5 hover:bg-gray-100 rounded-md text-gray-700 transition-colors" title="重置視角">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 導入 Mermaid 模組與初始化邏輯 -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        // 初始化 Mermaid 配置，強制設定透明背景
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
            themeVariables: {
                background: 'transparent'
            }
        });

        // 綁定 DOM 元素
        const input = document.getElementById('mermaid-input');
        const output = document.getElementById('mermaid-output');
        const errorMsg = document.getElementById('error-msg');
        const btnRender = document.getElementById('btn-render');
        const btnSvg = document.getElementById('btn-svg');
        const btnPng = document.getElementById('btn-png');
        const previewContainer = document.getElementById('preview-container');

        let pzInstance = null;

        // 初始化 Panzoom 拖曳與縮放
        function initPanzoom() {
            if (!pzInstance) {
                // 將事件綁定在外部容器上，但將縮放形變應用於內部的 output 容器
                pzInstance = window.Panzoom(previewContainer, {
                    maxScale: 20,
                    minScale: 0.1,
                    step: 0.2,
                    setTransform: (elem, { scale, x, y }) => {
                        output.style.transform = `scale(${scale}) translate(${x}px, ${y}px)`;
                    }
                });

                // 綁定滑鼠滾輪縮放 (加上 passive: false 以允許 preventDefault 防止頁面跟著滾動)
                previewContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    pzInstance.zoomWithWheel(e);
                }, { passive: false });

                // 綁定控制按鈕
                document.getElementById('btn-zoom-in').addEventListener('click', () => pzInstance.zoomIn());
                document.getElementById('btn-zoom-out').addEventListener('click', () => pzInstance.zoomOut());
                document.getElementById('btn-zoom-reset').addEventListener('click', () => pzInstance.reset());
            }
        }

        // 更新按鈕狀態
        function updateButtonState(disabled) {
            btnSvg.disabled = disabled;
            btnPng.disabled = disabled;
        }

        // 渲染圖表函數
        async function renderDiagram() {
            const code = input.value.trim();
            if (!code) return;

            try {
                // 隱藏錯誤訊息
                errorMsg.classList.add('hidden');
                updateButtonState(true);

                // 使用 mermaid.render 取得 SVG 碼
                const id = `mermaid-svg-${Date.now()}`;
                const { svg } = await mermaid.render(id, code);
                
                // 注入 SVG 到容器中
                output.innerHTML = svg;

                // 確保 SVG 元素本身背景是透明的
                const svgEl = output.querySelector('svg');
                if (svgEl) {
                    svgEl.style.backgroundColor = 'transparent';
                    // 確保包含 xmlns 屬性，這對轉圖很重要
                    if (!svgEl.getAttribute('xmlns')) {
                        svgEl.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                    }
                }

                // 成功渲染後更新按鈕
                updateButtonState(false);
            } catch (err) {
                console.error(err);
                // 顯示錯誤訊息
                output.innerHTML = '';
                errorMsg.textContent = err.message || '語法錯誤，請檢查您的 Mermaid 語法。';
                errorMsg.classList.remove('hidden');
                updateButtonState(true);
            }
        }

        // 觸發下載的通用函數
        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 下載 SVG 函數 (取得不受 Panzoom 影響的原始 SVG)
        function downloadSvg() {
            const svgEl = output.querySelector('svg');
            if (!svgEl) return;

            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svgEl);

            if (!source.match(/^<\?xml[^>]+>/mi)) {
                source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
            }

            const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            triggerDownload(url, 'mermaid-diagram.svg');
            
            setTimeout(() => URL.revokeObjectURL(url), 100);
        }

        // 下載 PNG 函數
        function downloadPng() {
            const svgEl = output.querySelector('svg');
            if (!svgEl) return;

            // 取得 SVG 的原始尺寸
            let width = 800;
            let height = 600;
            const viewBox = svgEl.getAttribute('viewBox');
            
            if (viewBox) {
                const [, , w, h] = viewBox.split(' ').map(parseFloat);
                width = w;
                height = h;
            } else {
                const rect = svgEl.getBoundingClientRect();
                width = rect.width;
                height = rect.height;
            }

            const canvas = document.createElement('canvas');
            const scale = 2; // 提升輸出畫質
            canvas.width = width * scale;
            canvas.height = height * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svgEl);

            const img = new Image();
            
            img.onload = function() {
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                const pngUrl = canvas.toDataURL('image/png');
                triggerDownload(pngUrl, 'mermaid-diagram.png');
            };

            img.onerror = function(err) {
                alert("轉換 PNG 時發生錯誤，請稍後再試。");
                console.error(err);
            };

            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
        }

        // 綁定事件監聽器
        btnRender.addEventListener('click', renderDiagram);
        btnSvg.addEventListener('click', downloadSvg);
        btnPng.addEventListener('click', downloadPng);

        // 支援即時預覽防抖動 (停止輸入 0.5 秒後自動渲染)
        let typingTimer;
        input.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(renderDiagram, 500); 
        });

        // 啟動工具
        initPanzoom();
        renderDiagram();
    </script>
</body>
</html>
